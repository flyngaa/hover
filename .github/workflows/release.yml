name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out Hover
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and set version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore pinned release helpers
        id: helper-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: dist/helpers
          key: release-helpers-${{ runner.os }}-${{ runner.arch }}-whisper-v1.9.1

      - name: Build pinned release helpers
        if: steps.helper-cache.outputs.cache-hit != 'true'
        run: Scripts/build-release-helpers.sh

      - name: Import temporary signing credentials
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/hover-signing.keychain-db"
          keychain_password="$(uuidgen)"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$p12_path"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$p12_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          sign_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application:/{print $2; exit}')"
          if [[ ! "$sign_identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "error: imported .p12 has no Developer ID Application identity" >&2
            exit 1
          fi

          echo "SIGN_IDENTITY=$sign_identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "NOTARY_KEY=$notary_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: ./release.sh

      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json isDraft --jq .isDraft 2>/dev/null || true)"

          case "$release_state" in
            "")
              gh release create "$GITHUB_REF_NAME" dist/Hover.dmg \
                --draft \
                --verify-tag \
                --title "Hover $APP_VERSION" \
                --generate-notes
              ;;
            true)
              echo "Reusing draft release for $GITHUB_REF_NAME"
              gh release upload "$GITHUB_REF_NAME" dist/Hover.dmg --clobber
              ;;
            false)
              echo "error: release $GITHUB_REF_NAME is already public" >&2
              exit 1
              ;;
          esac

      - name: Check out personal tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flyngaa/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update personal-tap cask
        shell: bash
        run: |
          set -euo pipefail
          cask_path="homebrew-tap/Casks/hover.rb"
          dmg_sha="$(shasum -a 256 dist/Hover.dmg | awk '{print $1}')"

          ruby - "$cask_path" "$APP_VERSION" "$dmg_sha" <<'RUBY'
          require "rubygems/version"

          path, version, sha = ARGV
          cask = File.read(path)
          current = cask.match(/^\s*version "([^"]+)"/)&.captures&.first
          raise "hover cask version line missing" unless current
          if Gem::Version.new(version) < Gem::Version.new(current)
            raise "refusing to downgrade hover cask from #{current} to #{version}"
          end
          raise "hover cask version line missing" unless cask.sub!(/version "[^"]+"/, %(version "#{version}"))
          raise "hover cask sha256 line missing" unless cask.sub!(/sha256 (?:"[0-9a-f]{64}"|:no_check)/, %(sha256 "#{sha}"))
          File.write(path, cask)
          RUBY

          ruby -c "$cask_path"
          git -C homebrew-tap diff --check
          if git -C homebrew-tap diff --quiet -- Casks/hover.rb; then
            echo "Personal-tap cask already matches Hover $APP_VERSION"
          else
            git -C homebrew-tap config user.name "github-actions[bot]"
            git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C homebrew-tap add Casks/hover.rb
            git -C homebrew-tap commit -m "Bump hover to $APP_VERSION"
            git -C homebrew-tap push origin HEAD:main
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          keychain_path="${SIGNING_KEYCHAIN:-$RUNNER_TEMP/hover-signing.keychain-db}"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
